services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickr_poc
      POSTGRES_PASSWORD: tickr_poc_local_only
      POSTGRES_DB: tickr_poc
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - poc_db:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  poc_db:
