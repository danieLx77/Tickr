name: PoC CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tickr_poc
          POSTGRES_PASSWORD: tickr_poc_local_only
          POSTGRES_DB: tickr_poc
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U tickr_poc" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: pytest -q backend/tests
        env:
          POC_TEST_DATABASE_URL: postgresql://tickr_poc:tickr_poc_local_only@localhost:5433/tickr_poc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
